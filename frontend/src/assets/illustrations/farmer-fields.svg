<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none" role="img" aria-label="Farmer holding smartphone in agricultural fields with tractor in background">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F5EC"/>
      <stop offset="100%" stop-color="#E8EFE5"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8DA778"/>
      <stop offset="100%" stop-color="#5B7A47"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F8C58"/>
      <stop offset="100%" stop-color="#4A6538"/>
    </linearGradient>
  </defs>

  <!-- Sky & Soft Clouds -->
  <rect width="400" height="320" rx="20" fill="url(#skyGrad)"/>
  <circle cx="80" cy="90" r="45" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="130" cy="85" r="55" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="320" cy="110" r="40" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Distant Hills -->
  <path d="M-20 220 C80 170 180 210 260 180 C320 160 380 190 420 180 L420 320 L-20 320 Z" fill="#9FB58B" fill-opacity="0.7"/>

  <!-- Tractor on distant hill -->
  <g transform="translate(290, 150) scale(0.45)">
    <rect x="25" y="15" width="28" height="24" rx="4" fill="#4A6538"/>
    <rect x="15" y="25" width="45" height="18" rx="3" fill="#5B7A47"/>
    <circle cx="20" cy="45" r="14" fill="#2C3D22" stroke="#F7F5EC" stroke-width="2"/>
    <circle cx="20" cy="45" r="5" fill="#F7F5EC"/>
    <circle cx="50" cy="48" r="9" fill="#2C3D22" stroke="#F7F5EC" stroke-width="1.5"/>
    <circle cx="50" cy="48" r="3" fill="#F7F5EC"/>
    <rect x="20" y="18" width="10" height="10" rx="2" fill="#E4EBD6"/>
    <rect x="42" y="8" width="4" height="12" fill="#2C3D22"/>
  </g>

  <!-- Midground Rolling Crop Field -->
  <path d="M-20 230 C90 200 200 240 310 210 C360 195 390 205 420 200 L420 320 L-20 320 Z" fill="url(#hill1)"/>

  <!-- Foreground Field with furrows -->
  <path d="M-20 260 C80 230 220 265 420 230 L420 320 L-20 320 Z" fill="url(#hill2)"/>
  <path d="M0 290 Q150 260 300 280" stroke="#E4EBD6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.4"/>
  <path d="M30 310 Q200 285 380 300" stroke="#E4EBD6" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 14" opacity="0.4"/>

  <!-- Farmer Figure -->
  <g transform="translate(65, 85)">
    <!-- White Kurta Body -->
    <path d="M60 135 C35 155 20 185 15 225 L105 225 C100 185 85 155 60 135 Z" fill="#FDFCF8" stroke="#E8E5DA" stroke-width="1.5"/>

    <!-- Green Scarf / Gamchha -->
    <path d="M42 145 C32 170 30 205 28 225 L40 225 C42 205 45 175 52 155 Z" fill="#5B7A47"/>
    <path d="M68 145 C78 170 80 205 82 225 L70 225 C68 205 65 175 58 155 Z" fill="#5B7A47"/>

    <!-- Arms holding phone -->
    <!-- Left Arm -->
    <path d="M30 170 Q45 185 62 185" stroke="#C88E62" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm -->
    <path d="M90 170 Q75 185 62 185" stroke="#C88E62" stroke-width="12" stroke-linecap="round"/>

    <!-- Hands & Smartphone -->
    <rect x="52" y="160" width="16" height="28" rx="3" fill="#1F2A1B"/>
    <rect x="54" y="163" width="12" height="20" rx="1.5" fill="#69B4FF"/>
    <circle cx="60" cy="185" r="1.5" fill="#FFFFFF"/>
    <!-- Thumbs -->
    <circle cx="51" cy="176" r="4.5" fill="#C88E62"/>
    <circle cx="69" cy="176" r="4.5" fill="#C88E62"/>

    <!-- Neck -->
    <rect x="53" y="122" width="14" height="18" fill="#C88E62" rx="2"/>

    <!-- Head -->
    <ellipse cx="60" cy="105" rx="16" ry="19" fill="#DFA274"/>

    <!-- Face Details -->
    <!-- Mustache -->
    <path d="M52 114 Q60 110 68 114 Q60 117 52 114 Z" fill="#3D2918"/>
    <!-- Eyes -->
    <circle cx="53" cy="103" r="1.8" fill="#1F2A1B"/>
    <circle cx="67" cy="103" r="1.8" fill="#1F2A1B"/>
    <!-- Eyebrows -->
    <path d="M50 99 Q54 97 57 99" stroke="#3D2918" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M63 99 Q66 97 70 99" stroke="#3D2918" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Friendly Smile -->
    <path d="M56 117 Q60 120 64 117" stroke="#3D2918" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Turban / Pagri (white folded fabric with soft sage shadow) -->
    <path d="M42 98 C40 82 50 68 62 68 C74 68 82 82 80 98 C78 102 72 105 60 105 C48 105 44 102 42 98 Z" fill="#FDFCF8" stroke="#E8E5DA" stroke-width="1.5"/>
    <path d="M42 90 C50 82 72 82 80 90" stroke="#D2DFCC" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M44 96 C52 90 68 90 78 96" stroke="#D2DFCC" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>