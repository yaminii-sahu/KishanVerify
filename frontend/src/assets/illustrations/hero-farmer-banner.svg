<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none" role="img" aria-label="Farmer holding tablet in front of agricultural fields">
  <defs>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A2BA8E"/>
      <stop offset="100%" stop-color="#849F6E"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#738F5D"/>
      <stop offset="100%" stop-color="#557340"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
    <linearGradient id="tabletScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2B1B"/>
      <stop offset="100%" stop-color="#2D422A"/>
    </linearGradient>
  </defs>

  <!-- Distant misty hills -->
  <path d="M-10 128 C60 110 140 125 210 115 C260 108 290 116 330 112 L330 170 L-10 170 Z" fill="#C4D4B2" fill-opacity="0.65"/>

  <!-- Round leafy trees behind the farmer -->
  <circle cx="56" cy="112" r="26" fill="#88A372" fill-opacity="0.75"/>
  <circle cx="88" cy="118" r="22" fill="#75905E" fill-opacity="0.85"/>
  <circle cx="34" cy="122" r="18" fill="#9DB788" fill-opacity="0.7"/>
  <circle cx="112" cy="126" r="16" fill="#6B8554" fill-opacity="0.8"/>

  <!-- Midground Rolling Crop Field -->
  <path d="M-10 138 C50 124 130 144 220 132 C270 126 300 132 330 128 L330 170 L-10 170 Z" fill="url(#hillGrad1)"/>

  <!-- Foreground Field with furrow crop lines -->
  <path d="M-10 150 C70 136 170 156 330 142 L330 170 L-10 170 Z" fill="url(#hillGrad2)"/>
  <path d="M5 160 Q120 146 270 158" stroke="#DCE8CD" stroke-width="1.5" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.45"/>
  <path d="M30 167 Q160 154 310 165" stroke="#DCE8CD" stroke-width="1.5" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.4"/>

  <!-- Farmer Figure (Profile / 3-quarter view looking down at tablet) -->
  <g transform="translate(18, 12)">
    <!-- Body / Shirt (Kurta) -->
    <path d="M68 96 C50 102 38 120 32 158 L126 158 C122 142 116 126 102 116 C95 110 88 104 78 98 Z" fill="url(#shirtGrad)"/>
    <path d="M72 98 L78 128 L72 158" stroke="#D8CEBD" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Left Shoulder & Arm holding tablet -->
    <path d="M42 114 C36 124 38 136 48 144 C56 150 70 150 78 144" stroke="#FAF7F0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 114 C36 124 38 136 48 144 C56 150 70 150 78 144" stroke="#D8CEBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Right Arm holding tablet -->
    <path d="M96 116 C102 124 100 136 90 144 C84 148 76 148 72 144" stroke="#EBE3D3" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hands & Fingers holding tablet -->
    <ellipse cx="64" cy="144" rx="4.5" ry="3.5" fill="#C88E62"/>
    <ellipse cx="86" cy="144" rx="4.5" ry="3.5" fill="#BA8056"/>

    <!-- Tablet device -->
    <g transform="translate(62, 116) rotate(14)">
      <!-- Tablet body -->
      <rect x="0" y="0" width="28" height="36" rx="2.5" fill="#182417" stroke="#3D5237" stroke-width="0.8"/>
      <!-- Screen -->
      <rect x="2" y="2" width="24" height="32" rx="1.5" fill="url(#tabletScreen)"/>
      <!-- Screen content lines (representing KisanVerify app) -->
      <rect x="4" y="5" width="12" height="2" rx="0.8" fill="#88B878" opacity="0.9"/>
      <rect x="4" y="9" width="20" height="1.5" rx="0.5" fill="#DDECD2" opacity="0.7"/>
      <rect x="4" y="12" width="16" height="1.5" rx="0.5" fill="#DDECD2" opacity="0.5"/>
      <circle cx="19" cy="22" r="3" fill="#88B878" opacity="0.85"/>
      <path d="M18 22 L19 23 L21 21" stroke="#182417" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Screen glow on face/body -->
      <circle cx="14" cy="18" r="8" fill="#99D688" opacity="0.12"/>
    </g>

    <!-- Neck -->
    <path d="M68 84 L68 98 L78 98 L78 84 Z" fill="#BD8458"/>

    <!-- Head profile (facing slightly right, angled down toward tablet) -->
    <ellipse cx="72" cy="73" rx="14" ry="16" fill="#CD9366"/>

    <!-- Ear -->
    <ellipse cx="61" cy="74" rx="3.2" ry="4.5" fill="#BD8458"/>

    <!-- Beard & Mustache -->
    <path d="M66 74 C65 84 72 90 80 88 C82 86 82 80 82 78 C76 78 72 75 70 73 Z" fill="#2D2116"/>
    <!-- Mustache -->
    <path d="M72 76 C76 76 82 79 84 81 C82 82 77 80 72 79 Z" fill="#2D2116"/>

    <!-- Eye looking down -->
    <ellipse cx="77" cy="70" rx="1.5" ry="1.2" fill="#1C140E"/>
    <!-- Eyebrow -->
    <path d="M74 67 C76 65 79 66 81 67" stroke="#2D2116" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M82 69 L86 73 L82 75" fill="#BD8458"/>

    <!-- Turban (Pagri) - soft folds of white/cream cloth with sage shading -->
    <!-- Base turban cap -->
    <path d="M56 68 C54 54 62 44 74 44 C84 44 91 52 90 64 C88 68 84 70 78 71 C68 71 58 70 56 68 Z" fill="#FAF8F2"/>
    <!-- Turban folds -->
    <path d="M54 63 C58 50 72 44 86 50 C92 53 93 59 90 65" stroke="#DFD7C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M56 56 C64 47 78 45 88 52" stroke="#FAF8F2" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M58 53 C66 43 78 43 86 48" stroke="#D3DCB9" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M57 66 C65 59 79 60 88 67" stroke="#D3DCB9" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Front fold knot -->
    <ellipse cx="84" cy="56" rx="5" ry="6" fill="#FAF8F2" stroke="#DFD7C7" stroke-width="0.8"/>
    <path d="M82 53 Q85 56 87 54" stroke="#D3DCB9" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
