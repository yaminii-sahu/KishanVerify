<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" role="img" aria-label="Tractor on rolling agricultural field">
  <!-- Rolling Field Curves -->
  <path d="M0 70 Q70 45 150 65 T280 50 L280 120 L0 120 Z" fill="#3D552E" fill-opacity="0.8"/>
  <path d="M0 90 Q100 65 200 85 T280 75 L280 120 L0 120 Z" fill="#324725"/>

  <!-- Field Contour Lines -->
  <path d="M20 95 Q90 75 180 90" stroke="#5B7A47" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <path d="M50 110 Q140 92 240 102" stroke="#5B7A47" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.5"/>

  <!-- Tractor Silhouette -->
  <g transform="translate(195, 32) scale(0.65)">
    <!-- Cabin -->
    <rect x="24" y="8" width="24" height="22" rx="3" fill="#E4EBD6" fill-opacity="0.9"/>
    <rect x="26" y="10" width="9" height="12" rx="1" fill="#4A6538"/>
    <!-- Body -->
    <rect x="12" y="20" width="46" height="16" rx="3" fill="#E4EBD6"/>
    <!-- Exhaust -->
    <rect x="44" y="6" width="3" height="12" fill="#E4EBD6"/>
    <!-- Big Rear Wheel -->
    <circle cx="22" cy="40" r="14" fill="#324725" stroke="#E4EBD6" stroke-width="3"/>
    <circle cx="22" cy="40" r="4" fill="#E4EBD6"/>
    <!-- Small Front Wheel -->
    <circle cx="50" cy="43" r="9" fill="#324725" stroke="#E4EBD6" stroke-width="2.5"/>
    <circle cx="50" cy="43" r="3" fill="#E4EBD6"/>
  </g>
</svg>